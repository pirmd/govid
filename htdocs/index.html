<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Govid – Éditeur de notes (mode Vi minimaliste)</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: #f8f8f8;
      line-height: 1.5;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.2em;
      color: #333;
      margin-bottom: 10px;
    }
    textarea {
      width: 100%;
      height: 75vh;
      padding: 10px;
      font-family: monospace;
      font-size: 14px;
      border: 1px solid #ddd;
      border-radius: 4px;
      resize: none;
      box-sizing: border-box;
      outline: none;
    }
    textarea:focus {
      border-color: #007bff;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #0056b3;
    }
    .filename {
      color: #666;
      font-size: 0.9em;
      margin-bottom: 5px;
    }
    .status {
      margin-top: 10px;
      font-size: 0.8em;
      font-family: monospace;
      padding: 5px 10px;
      border-radius: 4px;
    }
    .status.normal {
      background: #f8d7da;
      color: #721c24;
    }
    .status.insert {
      background: #d4edda;
      color: #155724;
    }
    .vi-help {
      margin-top: 15px;
      font-size: 0.8em;
      color: #666;
      text-align: right;
    }
    .vi-help kbd {
      background: #f0f0f0;
      padding: 2px 5px;
      border-radius: 3px;
      font-family: monospace;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="filename" id="filename">Chargement...</div>
    <form method="POST">
      <textarea name="content" id="content" placeholder="Appuyez sur 'i' pour insérer du texte..."></textarea>
      <br>
      <button type="submit">💾 Sauvegarder</button>
    </form>
    <div class="status" id="status"></div>
    <div class="vi-help">
      Commandes Vi: <kbd>i</kbd> insérer | <kbd>Esc</kbd> normal | <kbd>h</kbd><kbd>j</kbd><kbd>k</kbd><kbd>l</kbd> déplacer | 
      <kbd>0</kbd> début ligne | <kbd>$</kbd> fin ligne | <kbd>x</kbd> suppr. char | <kbd>dd</kbd> suppr. ligne | 
      <kbd>:w</kbd> sauvegarder | <kbd>:q</kbd> quitter | <kbd>:e fichier</kbd> ouvrir
    </div>
  </div>

  <script src="vi-minimal.js"></script>
  <script>
    // Extraire le chemin du fichier depuis l'URL
    const path = window.location.pathname.split('/').pop() || "index.txt";
    document.getElementById('filename').textContent = `Fichier: ${path}`;
    document.getElementById('status').textContent = "Chargement en cours...";

    // Charger le contenu du fichier
    fetch(window.location.pathname)
      .then(response => {
        if (!response.ok) {
          throw new Error("Fichier introuvable");
        }
        return response.text();
      })
      .then(content => {
        document.getElementById('content').value = content;
        document.getElementById('status').textContent = "Prêt. Appuyez sur 'i' pour commencer.";
      })
      .catch(() => {
        document.getElementById('content').value = "";
        document.getElementById('status').textContent = "Nouveau fichier. Appuyez sur 'i' pour commencer.";
      });

    // Message de confirmation après sauvegarde
    document.querySelector('form').addEventListener('submit', function() {
      document.getElementById('status').textContent = "Sauvegarde en cours...";
      setTimeout(() => {
        document.getElementById('status').textContent = "Fichier sauvegardé !";
      }, 500);
    });
  </script>
</body>
</html>
